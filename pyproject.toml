[project]
name = "vpn-simulator"
version = "2.0.0"
description = "VPN Protocol Simulator - Teaching, Testing, and Research Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VPN Simulator Team" }]
keywords = ["vpn", "network", "simulator", "testing", "protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.109.0,<0.110.0",
    "uvicorn[standard]>=0.27.0,<0.28.0",
    "websockets>=12.0,<13.0",
    "pydantic>=2.5.0,<3.0.0",
    "pyyaml>=6.0.1,<7.0",
    "python-dotenv>=1.0.0,<2.0",
    "click>=8.1.7,<9.0",
    "rich>=13.7.0,<14.0",
    "sqlalchemy[asyncio]>=2.0.23,<3.0.0",
    "aiosqlite>=0.19.0,<0.20.0",
    "psutil>=5.9.7,<6.0",
    "structlog>=24.1.0,<25.0.0",
    "httpx>=0.26.0,<0.27.0",
    "python-multipart>=0.0.6,<0.0.7",
    "scapy>=2.7.0",
    "cryptography>=50.0.0",
    "pysnmp>=7.1.28",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4,<8.0.0",
    "pytest-asyncio>=0.23.3,<0.24.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "mypy>=1.15.0,<1.19.0",
    "types-PyYAML>=6.0.12,<7.0",
    "types-psutil>=5.9.5,<6.0",
    "ruff>=0.1.9,<0.2.0",
    "black>=24.1.0,<25.0.0",
    "isort>=5.13.2,<6.0.0",
    "pre-commit>=3.6.0,<4.0.0",
]

[project.scripts]
vpn-simulator = "vpn_simulator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vpn_simulator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# tools/ 下的独立运维脚本（如 DHCP VLAN 占用工具）是无类型的命令行脚本，
# 不参与库 API 的类型检查，故放宽其未标注函数的检查。
[[tool.mypy.overrides]]
module = "vpn_simulator.tools.*"
disallow_untyped_defs = false
warn_return_any = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 外部 vendored 脚本，保持与上游字节一致，不做风格改写
"src/vpn_simulator/tools/dhcp_occupy_vlan.py" = ["E741", "UP031", "W292"]

[tool.black]
line-length = 100
target-version = ["py311"]
# 外部 vendored 脚本，保持与上游字节一致，不做格式改写
extend-exclude = "src/vpn_simulator/tools/dhcp_occupy_vlan.py"

[tool.isort]
profile = "black"
known_first_party = ["vpn_simulator"]
